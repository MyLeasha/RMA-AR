<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<script>
  		AFRAME.registerComponent('go-to-url', {
    	schema: { url: { type: 'string' } },
    	init: function () {
      	this.el.addEventListener('click', () => {
        // same-tab navigation (most reliable on mobile)
        window.location.href = this.data.url;
      	});
    	}
  		});
	</script>
  
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: https://myleasha.github.io/RMA-AR/assets/Targets/ARtargets.mind;
      filterMinCF: 0.001;
      filterBeta: 0.005;
      warmupTolerance: 5;
      missTolerance: 8;"
      color-space="sRGB"
      loading-screen="enabled: false"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
		<a-asset-item id="RMA_Full_CIty" src="https://myleasha.github.io/RMA-AR/assets/RMA_Full_CIty.glb"></a-asset-item>

		<img m id="HoverBadge" src="https://myleasha.github.io/RMA-AR/assets/Images/HoverBadge.png"></img>  
      </a-assets>   

      
	  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable"></a-camera>

			<a-text value="AML: Consequences of non-compliance" scale="0.08 0.08 0.08" position="0.63 -0.6 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

	 <a-entity light="type: ambient; color: #FFF; intensity: 1.2"></a-entity>
	 <a-entity light="type: directional; color: #FFF; intensity: 5.0" position="1 2 1" scale="0.08 0.08 0.08"></a-entity>
