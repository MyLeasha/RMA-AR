<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: https://myleasha.github.io/RMA-AR/assets/Targets/ARtargets.mind;
      filterMinCF: 0.001;
      filterBeta: 0.05;
      warmupTolerance: 5;
      missTolerance: 8;"
      color-space="sRGB"
      loading-screen="enabled: false"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
		<a-asset-item id="RMA_Full_CIty" src="https://myleasha.github.io/RMA-AR/assets/RMA_Full_CIty.glb"></a-asset-item>
      </a-assets>   

      <a-camera position="0 0 0" look-controls="enabled: false">
		<a-entity
  		cursor="fuse: false"
 		raycaster="objects: .clickable"
  		position="0 0 -1"
  		geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
  		material="color: white; shader: flat; opacity: 0.9">
		</a-entity>
	  </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        	<a-gltf-model rotation="0 0 0 " position="0 0 0.1" scale="0.08 0.08 0.08" src="#RMA_Full_CIty"></a-gltf-model>
		  
			<a-plane
  			id="cta"
  			class="clickable"
  			position="0.45 0.00 0.12"
  			width="0.35"
  			height="0.14"
  			material="color: #1E88E5; shader: flat; opacity: 0.95">
			</a-plane>

			<a-text
  			value="Visit site"
  			position="0.45 0.00 0.13"
  			align="center"
 		 	color="#FFFFFF"
  			width="1.2">
			</a-text>

	  </a-entity>
		
	 	<a-entity light="type: ambient; color: #FFF; intensity: 1.2"></a-entity>

		<a-entity
		 light="type: directional; color: #FFF; intensity: 5.0"
 		 position="1 2 1">
		</a-entity>

		<a-entity
  		light="type: directional; color: #FFF; intensity: 3.5"
  		position="-1 2 0">
		</a-entity>

		
    </a-scene>
  </body>
</html>
