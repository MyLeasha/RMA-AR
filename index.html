<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<script>
  		AFRAME.registerComponent('go-to-url', {
    	schema: { url: { type: 'string' } },
    	init: function () {
      	this.el.addEventListener('click', () => {
        // same-tab navigation (most reliable on mobile)
        window.location.href = this.data.url;
      	});
    	}
  		});
	</script>
  
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: https://myleasha.github.io/RMA-AR/assets/Targets/ARtargets.mind;
      filterMinCF: 0.001;
      filterBeta: 0.005;
      warmupTolerance: 5;
      missTolerance: 8;"
      color-space="sRGB"
      loading-screen="enabled: false"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
		<a-asset-item id="RMA_Full_CIty" src="https://myleasha.github.io/RMA-AR/assets/RMA_Full_CIty.glb"></a-asset-item>
      </a-assets>   

      <a-camera position="0 0 0" look-controls="enabled: false">
		<a-entity cursor="fuse: false" raycaster="objects: .clickable" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" material="color: white; shader: flat; opacity: 0.9"></a-entity>
	  </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        	<a-gltf-model src="#RMA_Full_CIty" rotation="0 0 0 " position="0 0 0" scale="0.08 0.08 0.08"></a-gltf-model>
			
			<a-entity position="0.45 0.10 0.12">
  			<a-plane width="0.35" height="0.14" position="0.175 0 0" material="color:#12b4dd; shader: flat" class="clickable" go-to-url="url: https://www.youtube.com/"></a-plane>
			<a-text value="Business Continuity" scale="0.08 0.08 0.08" position="0.6 0.75 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>
			</a-entity>

		  	<a-entity position="0.45 0.10 0.12">
  			<a-plane width="0.35" height="0.14" position="0.175 0 0" material="color:#12b4dd; shader: flat" class="clickable" go-to-url="url: https://www.youtube.com/"></a-plane>
			<a-text value="Code of Ethics" scale="0.08 0.08 0.08" position="0.6 0.75 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>
			</a-entity>
		  
			<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 0.45 0" width="4" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Risk Management" scale="0.08 0.08 0.08" position="0.6 0.45 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

		  	<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 0.3 0" width="6" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Treating Customers Fairly" scale="0.08 0.08 0.08" position="0.6 0.3 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

		  	<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 0.15 0" width="7" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Ocupational Health and Safety" scale="0.08 0.08 0.08" position="0.6 0.15 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

		  	<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 0 0" width="8" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Anti Money Laundering: What is AML?" scale="0.08 0.08 0.08" position="0.6 0 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

			<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 -0.15 0" width="10" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Anti Money Laundering: The Legal Framework" scale="0.08 0.08 0.08" position="0.6 -0.15 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

			<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 -0.3 0" width="8" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Anti Money Laundering: AML Roles" scale="0.08 0.08 0.08" position="0.6 -0.3 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

		  	<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 -0.45 0" width="9" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Anti Money Laundering: Suspicious and Unusual Behaviours" scale="0.08 0.08 0.08" position="0.6 -0.45 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

		  	<a-plane id="cta" class="clickable" scale="0.08 0.08 0.08" position="0.8 -0.6 0" width="8" height="1.5" material="color: #12b4dd; shader: flat; opacity: 0.95" class="clickable" go-to-url="url: https://www.youtube.com/" ></a-plane>
			<a-text value="Anti Money Laundering: Consequences of non-compliance" scale="0.08 0.08 0.08" position="0.6 -0.6 0" align="left" anchor="left" color="#FFFFFF" width="10" class="clickable" go-to-url="url: https://www.youtube.com/"></a-text>

		  
	  </a-entity>
		
	 <a-entity light="type: ambient; color: #FFF; intensity: 1.2"></a-entity>
	 <a-entity light="type: directional; color: #FFF; intensity: 5.0" position="1 2 1" scale="0.08 0.08 0.08"></a-entity>
	 <a-entity light="type: directional; color: #FFF; intensity: 3.5" position="-1 2 0" scale="0.08 0.08 0.08"></a-entity>

		
    </a-scene>
  </body>
</html>
