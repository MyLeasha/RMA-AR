
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    <script>
      AFRAME.registerComponent("fit-to-marker", {
        schema: { targetSize: { default: 0.7 } },
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            console.log("[model-loaded]", this.el);
            const obj = this.el.getObject3D("mesh");
            if (!obj) {
              console.warn("No mesh on model-loaded");
              return;
            }

            const box = new THREE.Box3().setFromObject(obj);
            const size = new THREE.Vector3();
            box.getSize(size);

            const maxDim = Math.max(size.x, size.y, size.z);
            console.log("bbox size:", size, "maxDim:", maxDim);

            if (!maxDim || maxDim === 0) return;

            const s = this.data.targetSize / maxDim;
            this.el.object3D.scale.set(s, s, s);
            console.log("Applied scale:", s);
          });

          this.el.addEventListener("model-error", (e) => {
            console.error("[model-error]", e?.detail || e);
          });
        },
      });
    </script>

    <a-scene
      mindar-image="imageTargetSrc: https://myleasha.github.io/RMA-AR/assets/Targets/ARtargets.mind;
                   filterMinCF: 0.0001;
                   filterBeta: 0.001;
                   warmupTolerance: 3;
                   missTolerance: 10;"
      color-space="sRGB"
      embedded
      loading-screen="enabled: false"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- ✅ Add lights so GLB isn't black -->
      <a-entity light="type: ambient; intensity: 1.0; color: #FFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="0 1 1"></a-entity>

      <a-assets>
        <a-asset-item
          id="RMA_Full_CIty"
          src="https://myleasha.github.io/RMA-AR/assets/RMA_Full_CIty.glb"
        ></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="t0" mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="#RMA_Full_CIty"
          rotation="0 0 0"
          position="0 0 0.1"
          fit-to-marker="targetSize: 0.7"
        ></a-gltf-model>
      </a-entity>

      <script>
        // ✅ MindAR event debugging (from MindAR example patterns)
        const sceneEl = document.querySelector("a-scene");
        const targetEl = document.querySelector("#t0");

        sceneEl.addEventListener("arReady", () => console.log("[arReady]"));
        sceneEl.addEventListener("arError", (e) => console.error("[arError]", e));

        targetEl.addEventListener("targetFound", () => console.log("[targetFound]"));
        targetEl.addEventListener("targetLost", () => console.log("[targetLost]"));
      </script>
    </a-scene>
  </body>
</html>
